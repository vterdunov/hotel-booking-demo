server:
  port: 8081

spring:
  application:
    name: booking-service
  datasource:
    url: jdbc:h2:mem:bookingdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: HotelBookingSecretKeyThatIsAtLeast256BitsLongForHS256Algorithm
  expiration: 3600000

hotel-service:
  url: http://localhost:8082
  max-retries: 3
  timeout: 5000

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  admin:
    enabled: ${ADMIN_ENABLED:false}
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:}

logging:
  level:
    com.hotel.booking: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
